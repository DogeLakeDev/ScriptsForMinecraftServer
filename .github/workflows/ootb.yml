name: ootb

# 多平台冒烟：Windows + Linux。不启动真实 BDS / LLBot。macOS 暂不适配。

on:
  push:
    branches: [main, refactor/**]
  pull_request:
    branches: [main, refactor/**]
  workflow_dispatch:

concurrency:
  group: ootb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 默认 CI Node 唯一来源: 仓库根 .node-version（与 npm-publish 共用）。
          # db-server 需 ≥22.13（node:sqlite 无 flag）
          node-version-file: .node-version
          cache: npm

      - name: Install root deps
        run: npm ci --no-audit --no-fund

      - name: Build all workspaces
        run: npm run build --workspaces --if-present

      - name: SDK testing sandbox
        run: npm test -w @sfmc-bds/sdk

      - name: Portable workspace unit tests
        run: |
          npm test -w @sfmc-bds/db-server
          npm test -w @sfmc-bds/qq-bridge
          npm test -w @sfmc-bds/bds-tools
          npm test -w @sfmc-bds/cli

      - name: mc-fake 生成物与仓库一致
        run: |
          npm run gen:mc-fake -w @sfmc-bds/sdk
          if ! git diff --ignore-cr-at-eol --exit-code -- "modules/sdk/@sfmc-sdk/src/testing/engine/generated/"; then
            echo "::error::generated/ 与 gen:mc-fake 不一致：请本地 npm run gen:mc-fake -w @sfmc-bds/sdk 后提交"
            exit 1
          fi

      - name: Seed configs via SDK ensure
        env:
          SFMC_ROOT: ${{ github.workspace }}
        run: node packages/tools/seed-configs.mjs

      - name: Run check-ootb
        env:
          SFMC_ROOT: ${{ github.workspace }}
        run: npm run check-ootb

      - name: Run smoke-modules
        env:
          SFMC_ROOT: ${{ github.workspace }}
        run: node packages/tools/run-with-db-server.mjs node packages/tools/smoke-modules.mjs
