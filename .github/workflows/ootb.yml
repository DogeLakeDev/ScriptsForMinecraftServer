name: ootb

on:
  push:
    branches: [main, refactor/**]
  pull_request:
    branches: [main, refactor/**]
  workflow_dispatch:

concurrency:
  group: ootb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm -r --filter '!@sfmc-bds/docs-site' run build

      - name: Run platform verify
        env:
          SFMC_ROOT: ${{ github.workspace }}
        run: pnpm run verify
