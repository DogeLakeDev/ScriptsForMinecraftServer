name: ootb

# 多平台冒烟：Windows + Linux；macOS 暂不适配。

on:
  push:
    branches: [main, refactor/**]
  pull_request:
    branches: [main, refactor/**]
  workflow_dispatch:

concurrency:
  group: ootb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 默认 CI Node 唯一来源: 仓库根 .node-version（与 npm-publish 共用）。
          # db-server 需 ≥22.13（node:sqlite 无 flag）
          node-version-file: .node-version
          cache: pnpm

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm -r --filter '!@sfmc-bds/docs-site' run build

      - name: SDK testing sandbox
        run: pnpm --filter @sfmc-bds/sdk test

      - name: Portable workspace unit tests
        run: |
          pnpm --filter @sfmc-bds/db-server test
          pnpm --filter @sfmc-bds/qq-bridge test
          pnpm --filter @sfmc-bds/bds-tools test
          pnpm --filter @sfmc-bds/cli test

      - name: mc-fake 生成物与仓库一致
        run: |
          pnpm --filter @sfmc-bds/sdk run gen:mc-fake
          if ! git diff --ignore-cr-at-eol --exit-code -- "modules/sdk/@sfmc-sdk/src/testing/engine/generated/"; then
            echo "::error::generated/ 与 gen:mc-fake 不一致：请本地 pnpm --filter @sfmc-bds/sdk run gen:mc-fake 后提交"
            exit 1
          fi

      - name: Run platform verify
        env:
          SFMC_ROOT: ${{ github.workspace }}
        run: pnpm run verify
