name: changeset-release

# Changesets: 在 main 上开/更新 Version Packages PR；
# 合并该 PR（版本已 bump）后自动 changeset publish。
# 当前仓库处于 pre mode (beta)：publish 仅推 npm dist-tag beta。
# 未达 release 门槛前禁止 changeset pre exit。

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: changeset-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # fetch-depth:0：tag-packages 需 HEAD~1 做版本 diff；浅克隆会误触发全量 tag 回退路径
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci --no-audit --no-fund

      - name: build publishable workspaces
        run: |
          npm run build --workspace @sfmc-bds/sdk
          npm run build --workspace @sfmc-bds/eslint-plugin --if-present
          npm run build --workspace @sfmc-bds/bds-tools --if-present
          npm run build --workspace @sfmc-bds/db-server --if-present
          npm run build --workspace @sfmc-bds/qq-bridge --if-present
          npm run build --workspace @sfmc-bds/cli --if-present
          npm run build --workspace @sfmc-bds/tools --if-present
          npm run build --workspace @sfmc-bds/sfmc --if-present

      # Version PR 需要「创建 PR」权限。若仅用 GITHUB_TOKEN 且仓库关闭
      # Settings→Actions→General→「Allow GitHub Actions to create and approve pull requests」，
      # changesets/action 会以 HttpError 失败（分支已推送但 PR 未创建）。
      # 优先使用 PAT Secret CHANGESETS_GITHUB_TOKEN（repo 或 contents+pull_requests）；
      # 未配置时回退 GITHUB_TOKEN（需上述勾选为开）。
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          # CI 不跑交互 changeset/version；只 publish + tag + gh release
          # tag-packages 在 CI=true 时默认 --from-existing（publish 已建 tag，避免浅克隆误打全量）
          publish: npm run ci-release-packages
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
