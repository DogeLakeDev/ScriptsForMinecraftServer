name: npm-publish

# 应急单包补发（默认 --tag beta）。
# 示例: Actions → npm-publish → Run workflow
#   package: @sfmc-bds/sdk
#   version: 0.2.0-beta.0   （须与 package.json 一致）
#   dist_tag: beta          （或 latest）

on:
  workflow_dispatch:
    inputs:
      package:
        description: "@sfmc-bds/**(?)**"
        required: true
        type: string
      version:
        description: "版本号"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag"
        required: false
        default: beta
        type: choice
        options:
          - beta
          - latest

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: parse + verify package version
        id: meta
        env:
          PUBLISH_PACKAGE: ${{ inputs.package }}
          PUBLISH_VERSION: ${{ inputs.version }}
          PUBLISH_DIST_TAG: ${{ inputs.dist_tag || 'beta' }}
        run: node packages/tools/resolve-npm-publish-dispatch.mjs

      - name: block accidental latest while in beta-only
        if: steps.meta.outputs.dist_tag == 'latest'
        run: |
          if [ -f .changeset/pre.json ]; then
            mode=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.changeset/pre.json','utf8')).mode)")
            if [ "$mode" = "pre" ]; then
              echo "::error::仓库仍处于 changesets pre mode。请使用 changeset pre exit（你确定吗？）。"
              exit 1
            fi
          fi

      - name: skip if already published
        if: steps.meta.outputs.already_published == 'true'
        run: echo "Already on npm — skip"

      - run: npm ci --no-audit --no-fund
        if: steps.meta.outputs.already_published != 'true'

      - name: Build all workspaces
        if: steps.meta.outputs.already_published != 'true'
        run: npm run build --workspaces --if-present

      - name: build target + publishable deps
        if: steps.meta.outputs.already_published != 'true'
        # DRY/OCP：依赖闭包由 listPublishableBuildDeps 派生
        run: node packages/tools/build-publishable.mjs --workspace "${{ steps.meta.outputs.workspace }}"

      - name: publish to npm
        if: steps.meta.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >
          npm publish
          --workspace "${{ steps.meta.outputs.workspace }}"
          --access public
          --tag "${{ steps.meta.outputs.dist_tag }}"
          --provenance
